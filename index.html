<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e7" />
    <meta
      name="description"
      content="日叶 Dayleaf — 一款安静、私密、本地优先的日记应用。"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>日叶 Dayleaf</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="brand-button" aria-label="返回今天">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M25.7 5.1C18.4 5.5 11 9 7.5 14.9c-2.1 3.6-1.8 7.1-.2 9.7 4.4-7.8 9.3-11.7 14.7-14.2-4.6 3.7-8.4 7.9-11.2 13.2 2.9.8 6.1-.1 8.5-2.7 4.1-4.5 4.7-10.7 6.4-15.8Z"/></svg>
          </span>
          <span>
            <strong>日叶</strong>
            <small>Dayleaf</small>
          </span>
        </button>

        <label class="search-box" for="search-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.3-4.3m2.3-5.2A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
          <input id="search-input" type="search" placeholder="搜索回忆…" autocomplete="off" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="topbar-actions">
          <span class="privacy-pill">
            <span class="status-dot"></span>
            仅保存在本机
          </span>
          <button class="icon-button" id="theme-button" aria-label="切换深色模式" title="切换主题">
            <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="icon-button" id="backup-button" aria-label="备份与恢复" title="备份与恢复">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 16v3h14v-3"/></svg>
          </button>
          <button class="primary-button compact" id="new-entry-button">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            写日记
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" id="sidebar">
          <section class="calendar-card">
            <div class="section-heading">
              <button class="icon-button subtle" id="previous-month" aria-label="上个月">
                <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <h2 id="calendar-title"></h2>
              <button class="icon-button subtle" id="next-month" aria-label="下个月">
                <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </section>

          <section class="insight-card">
            <div class="insight-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 18h8M9 22h6"/><path d="M8.4 14.5A7 7 0 1 1 15.6 14.5c-.9.6-1.3 1.4-1.4 2.5H9.8c-.1-1.1-.5-1.9-1.4-2.5Z"/></svg>
            </div>
            <div>
              <span class="eyebrow">写作提示</span>
              <p id="daily-prompt"></p>
            </div>
          </section>

          <section class="stats-card">
            <div>
              <strong id="entry-count">0</strong>
              <span>篇日记</span>
            </div>
            <div class="divider"></div>
            <div>
              <strong id="streak-count">0</strong>
              <span>天连续</span>
            </div>
            <div class="divider"></div>
            <div>
              <strong id="word-count">0</strong>
              <span>总字数</span>
            </div>
          </section>

          <nav class="filter-list" aria-label="日记筛选">
            <button class="filter-item active" data-filter="all">
              <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
              所有日记
              <span id="all-count">0</span>
            </button>
            <button class="filter-item" data-filter="favorite">
              <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
              珍藏
              <span id="favorite-count">0</span>
            </button>
          </nav>

          <p class="sidebar-footnote">
            <svg viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2"/><rect x="5" y="10" width="14" height="11" rx="2"/></svg>
            无账号 · 无追踪 · 可随时导出
          </p>
        </aside>

        <section class="journal-panel">
          <div class="list-pane">
            <div class="list-header">
              <div>
                <span class="eyebrow">你的时光</span>
                <h1 id="list-title">所有日记</h1>
              </div>
              <button class="icon-button mobile-menu" id="mobile-menu-button" aria-label="打开日历">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
            </div>
            <div class="entry-list" id="entry-list"></div>
            <div class="empty-list" id="empty-list" hidden>
              <span>✦</span>
              <h3>这里还很安静</h3>
              <p>写下今天的一点光亮，或一个不想忘记的瞬间。</p>
              <button class="secondary-button" id="empty-new-button">写下第一篇</button>
            </div>
          </div>

          <article class="editor-pane" id="editor-pane">
            <div class="editor-placeholder" id="editor-placeholder">
              <span class="large-leaf">
                <svg viewBox="0 0 32 32"><path d="M25.7 5.1C18.4 5.5 11 9 7.5 14.9c-2.1 3.6-1.8 7.1-.2 9.7 4.4-7.8 9.3-11.7 14.7-14.2-4.6 3.7-8.4 7.9-11.2 13.2 2.9.8 6.1-.1 8.5-2.7 4.1-4.5 4.7-10.7 6.4-15.8Z"/></svg>
              </span>
              <h2>选择一篇日记</h2>
              <p>让那些值得记住的日子重新展开。</p>
            </div>

            <form id="entry-form" hidden>
              <div class="editor-toolbar">
                <div class="editor-date-group">
                  <button class="icon-button mobile-back" id="mobile-back-button" type="button" aria-label="返回日记列表">
                    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
                  </button>
                  <label class="date-field">
                    <span>记录日期</span>
                    <input id="entry-date" type="date" />
                  </label>
                </div>
                <div class="toolbar-actions">
                  <span class="save-status" id="save-status">已保存</span>
                  <button class="icon-button" id="favorite-button" type="button" aria-label="珍藏这篇日记">
                    <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
                  </button>
                  <button class="icon-button danger-hover" id="delete-button" type="button" aria-label="删除这篇日记">
                    <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></svg>
                  </button>
                </div>
              </div>

              <div class="editor-content">
                <div class="mood-row">
                  <span>此刻心情</span>
                  <div class="mood-picker" id="mood-picker">
                    <button type="button" data-mood="晴朗" title="晴朗">☀️</button>
                    <button type="button" data-mood="平静" title="平静">🌿</button>
                    <button type="button" data-mood="雀跃" title="雀跃">✨</button>
                    <button type="button" data-mood="低落" title="低落">🌧️</button>
                    <button type="button" data-mood="疲惫" title="疲惫">🌙</button>
                  </div>
                </div>
                <input id="entry-title" class="title-input" type="text" placeholder="给今天一个标题…" maxlength="100" />
                <textarea id="entry-content" class="content-input" placeholder="今天发生了什么？&#10;&#10;不必写得完整，只要真实就好。"></textarea>
                <div class="editor-footer">
                  <label class="tag-field">
                    <svg viewBox="0 0 24 24"><path d="M20 13 13 20l-9-9V4h7l9 9Z"/><circle cx="8.5" cy="8.5" r="1"/></svg>
                    <input id="entry-tags" type="text" placeholder="添加标签，用逗号分隔" />
                  </label>
                  <span id="editor-word-count">0 字</span>
                </div>
              </div>
            </form>
          </article>
        </section>
      </main>
    </div>

    <dialog id="backup-dialog" class="dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">数据自由</span>
            <h2>备份与恢复</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="dialog-copy">日记只存储在这个浏览器中。建议定期导出备份，换设备时也能轻松带走。</p>
        <div class="backup-options">
          <button class="backup-option" id="export-json-button" type="button">
            <span class="option-icon">↓</span>
            <span><strong>完整备份</strong><small>导出可恢复的 JSON 文件</small></span>
          </button>
          <button class="backup-option" id="export-markdown-button" type="button">
            <span class="option-icon">M↓</span>
            <span><strong>导出 Markdown</strong><small>任何文本工具都能打开</small></span>
          </button>
          <label class="backup-option" for="import-input">
            <span class="option-icon">↑</span>
            <span><strong>恢复备份</strong><small>从 Dayleaf JSON 文件导入</small></span>
          </label>
          <input id="import-input" type="file" accept="application/json,.json" hidden />
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="dialog small-dialog">
      <form method="dialog">
        <span class="warning-icon">!</span>
        <h2>删除这篇日记？</h2>
        <p>删除后无法撤销，但你可以先导出一份完整备份。</p>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel">再想想</button>
          <button class="danger-button" id="confirm-delete-button" value="confirm">删除日记</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
